<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Get in touch with Bryan Tuer: email, LinkedIn, or leave a note directly from the site." />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="color-scheme" content="light dark" />
  <!-- Pick Day or Night before first paint: saved choice, else the OS setting. -->
  <script>
    (function () {
      var look = null;
      try { look = localStorage.getItem('bt-look'); } catch (e) {}
      if (look !== 'day' && look !== 'night') {
        look = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
      }
      document.documentElement.setAttribute('data-look', look);
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="nav">
      <a class="brand" href="index.html">Bryan Tuer <small>support ops · baltimore</small></a>
      <div class="nav-right">
        <nav aria-label="Pages"><ul class="nav-links">
          <li><a href="index.html" class="nav-link" data-text="home">home</a></li>
          <li><a href="work.html" class="nav-link" data-text="work">work</a></li>
          <li><a href="life.html" class="nav-link" data-text="life">life</a></li>
          <li><a href="contact.html" class="nav-link" data-text="contact" aria-current="page">contact</a></li>
        </ul></nav>
        <button class="look-switch" type="button" role="switch" aria-checked="false" aria-label="Night look">
          <span class="look-day" aria-hidden="true">Day</span><span class="look-night" aria-hidden="true">Night</span>
        </button>
      </div>
    </header>

    <main>
      <div class="page-head">
        <p class="label">Contact</p>
        <h1 class="lede">Questions, support ops shop talk, or just saying hi.</h1>
      </div>
      <div class="contact">
        <section class="direct" aria-labelledby="direct-label">
          <h2 class="label" id="direct-label">Direct</h2>
          <ul>
            <li><a href="mailto:bmtuer@gmail.com">Email <span>bmtuer@gmail.com</span></a></li>
            <li><a href="https://www.linkedin.com/in/bryantuer/" target="_blank" rel="noopener">LinkedIn <span>in/bryantuer →</span></a></li>
          </ul>
        </section>

        <section aria-labelledby="note-label">
          <h2 class="label sec-label" id="note-label">Leave a note</h2>
          <form class="note-form" action="https://formspree.io/f/xdawbdeq" method="POST">
            <div class="field">
              <label for="email">Your email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" placeholder="What's on your mind?" required />
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" placeholder="Say hello..." required></textarea>
            </div>
            <button type="submit" class="btn">Send it →</button>
          </form>
        </section>
      </div>
    </main>

    <footer class="footer">
      <span>Say hi: <a href="mailto:bmtuer@gmail.com">email</a> · <a href="https://www.linkedin.com/in/bryantuer/" target="_blank" rel="noopener">LinkedIn →</a></span>
      <span>Baltimore, MD</span>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
